<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orbe App</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <!-- =========================
         LOGIN
    ========================== -->

    <div id="login-screen">

        <div class="login-card">

            <h1>Orbe App</h1>

            <p>Inicia sesión para continuar</p>

            <form id="login-form">

                <input
                    type="email"
                    id="email"
                    placeholder="Correo electrónico"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Contraseña"
                    required
                >

                <button type="submit">
                    Iniciar sesión
                </button>

            </form>

            <p id="login-message"></p>

        </div>

    </div>


    <!-- =========================
         APP
    ========================== -->

    <div id="app-screen" class="hidden">

        <header>

            <div>
                <h1>Orbe App</h1>
                <p id="user-info"></p>
            </div>

            <button id="logout-button">
                Cerrar sesión
            </button>

        </header>


        <main>

            <!-- =====================
                 PROYECTOS
            ====================== -->

            <section>

                <div class="section-header">

                    <h2>Proyectos</h2>

                    <button
                        id="new-project-button"
                        class="admin-only"
                    >
                        + Nuevo proyecto
                    </button>

                </div>

                <div id="projects-container">
                    <p>Cargando proyectos...</p>
                </div>

            </section>


            <!-- =====================
                 TAREAS
            ====================== -->

            <section>

                <div class="section-header">

                    <h2>Tareas</h2>

                    <button
                        id="new-task-button"
                        class="admin-only"
                    >
                        + Nueva tarea
                    </button>

                </div>

                <div id="tasks-container">
                    <p>Cargando tareas...</p>
                </div>

            </section>

        </main>

    </div>


    <!-- =========================
         MODAL
    ========================== -->

    <div id="modal" class="modal hidden">

        <div class="modal-box">

            <button id="close-modal" class="close-button">
                ×
            </button>

            <h2 id="modal-title">
                Nuevo
            </h2>

            <form id="modal-form">

                <div id="modal-fields"></div>

                <button type="submit">
                    Guardar
                </button>

            </form>

        </div>

    </div>


    <script src="app.js"></script>

</body>

</html>
