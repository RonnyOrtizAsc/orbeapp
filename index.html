<section id="page-tasks" class="page hidden">
  <div class="page-header">
    <div>
      <p class="eyebrow">PRODUCCIÓN</p>
      <h1>Tareas</h1>
      <p>Todo lo que hay que hacer.</p>
    </div>

    <button
      id="newTaskButton"
      class="button button-dark manager-only"
      type="button"
    >
      + Nueva tarea
    </button>
  </div>

  <section id="smartTasksPanel" class="smart-tasks-panel">
    <div class="smart-task-header">
      <div>
        <p class="eyebrow">PRODUCTIVIDAD</p>
        <h3>Tareas inteligentes</h3>
        <p>
          Crea objetivos que se repiten automáticamente y registra
          resultados sin crear cada tarea manualmente.
        </p>
      </div>

      <button
        id="newRecurringTaskButton"
        class="button button-dark manager-only"
        type="button"
      >
        + Nueva tarea inteligente
      </button>
    </div>

    <div id="recurringTasksList" class="smart-tasks-list"></div>

    <div id="callSessionPanel" class="call-session-panel hidden">
      <div class="call-session-main">
        <div>
          <p class="eyebrow">SESIÓN DE LLAMADAS</p>
          <h3 id="callSessionTitle">Sesión de llamadas</h3>
          <p id="callSessionStatus">Sesión no iniciada</p>
        </div>

        <div class="call-session-actions">
          <button
            id="startCallSessionButton"
            class="button button-dark"
            type="button"
          >
            ▶ Iniciar sesión
          </button>

          <button
            id="endCallSessionButton"
            class="button button-light hidden"
            type="button"
          >
            ■ Terminar sesión
          </button>
        </div>
      </div>

      <div class="call-progress">
        <div class="call-progress-label">
          <span id="callProgressLabel">0 / 0</span>
          <strong id="callProgressPercent">0%</strong>
        </div>

        <div class="progress-track">
          <div
            id="callProgressBar"
            class="progress-bar"
            style="width: 0%"
          ></div>
        </div>
      </div>

      <button
        id="registerCallButton"
        class="button button-dark full hidden"
        type="button"
      >
        + Registrar llamada
      </button>
    </div>
  </section>

  <div class="toolbar">
    <input
      id="taskSearch"
      class="search"
      type="search"
      placeholder="Buscar tareas..."
      autocomplete="off"
    >

    <select id="taskStatusFilter" class="select">
      <option value="all">Todos</option>
      <option value="pending">Pendientes</option>
      <option value="in_progress">En progreso</option>
      <option value="completed">Completadas</option>
    </select>

    <select id="taskPriorityFilter" class="select">
      <option value="all">Prioridad</option>
      <option value="high">Alta</option>
      <option value="medium">Media</option>
      <option value="low">Baja</option>
    </select>

    <select id="taskProjectFilter" class="select">
      <option value="all">Todos los proyectos</option>
      <option value="none">Sin proyecto</option>
    </select>
  </div>

  <div class="kanban">
    <div class="kanban-column">
      <div class="kanban-title">
        <span>Pendientes</span>
        <strong id="pendingCount">0</strong>
      </div>
      <div id="tasksPending" class="kanban-tasks"></div>
    </div>

    <div class="kanban-column">
      <div class="kanban-title">
        <span>En progreso</span>
        <strong id="progressCount">0</strong>
      </div>
      <div id="tasksProgress" class="kanban-tasks"></div>
    </div>

    <div class="kanban-column">
      <div class="kanban-title">
        <span>Completadas</span>
        <strong id="completedCount">0</strong>
      </div>
      <div id="tasksCompleted" class="kanban-tasks"></div>
    </div>
  </div>
</section>
